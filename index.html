<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone — Casual Games</title>
  <link rel="stylesheet" href="/css/shared/tokens.css">
  <link rel="stylesheet" href="/css/shared/components.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header class="site-header">
    <h1>🎮 GameZone</h1>
    <p class="subtitle">Free casual games — no ads, no install</p>
  </header>

  <main class="game-grid">
    <a href="/water-sort/" class="game-card">
      <div class="game-icon">💧</div>
      <h2>Water Sort</h2>
      <p>Sort the colored water into the right bottles — logic puzzle</p>
      <span class="play-btn">Play →</span>
    </a>
    <a href="/link-link/" class="game-card">
      <div class="game-icon">🔗</div>
      <h2>Link Link</h2>
      <p>Classic connect matching pairs — clear the board</p>
      <span class="play-btn">Play →</span>
    </a>
  </main>

  <script src="/shared/site-header.js" defer></script>
</body>
</html>
