<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Link — GameZone</title>
  <link rel="stylesheet" href="/css/shared/tokens.css">
  <link rel="stylesheet" href="/css/shared/components.css">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      max-width: 560px;
      margin: 2rem auto;
      gap: 6px;
    }
    .cell {
      aspect-ratio: 1;
      background: #1e293b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .cell.empty {
      background: transparent;
      cursor: default;
    }
    .cell.selected {
      background: #3b82f6;
      transform: scale(1.08);
    }
    .cell.matched {
      animation: fadeOut 0.3s forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0); pointer-events: none; }
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      max-width: 560px;
      margin: 0 auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <a href="/" class="back-btn">← Back</a>
      <h1>🔗 Link Link</h1>
    </div>
    <div class="status-bar">
      <span id="matched">Matched: 0 / 32</span>
      <span id="time">0s</span>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button id="reset">New Game</button>
    </div>
  </div>

  <script>
    const EMOJIS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🥝', '🍑', '🥭', '🍌', '🥥', '🍍', '🍆', '🥦', '🌽', '🥕'];
    const ROWS = 6, COLS = 8;
    const TOTAL_PAIRS = (ROWS * COLS) / 2;

    let grid = [];
    let selected = null;
    let matched = 0;
    let startTime = Date.now();

    function initGame() {
      selected = null; matched = 0;
      document.getElementById('matched').textContent = 'Matched: 0 / ' + TOTAL_PAIRS;
      grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
      // Fill pairs
      const pairs = [];
      for (let i = 0; i < TOTAL_PAIRS; i++) {
        pairs.push(i % EMOJIS.length, i % EMOJIS.length);
      }
      // Shuffle
      for (let i = pairs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
      }
      let idx = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = pairs[idx++];
        }
      }
      render();
      startTime = Date.now();
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell' + (grid[r][c] === null ? ' empty' : '');
          if (grid[r][c] !== null) {
            cell.textContent = EMOJIS[grid[r][c]];
            cell.dataset.r = r; cell.dataset.c = c;
            cell.onclick = () => click(r, c);
            if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
          }
          board.appendChild(cell);
        }
      }
    }

    function click(r, c) {
      if (grid[r][c] === null) return;
      if (selected === null) {
        selected = {r, c};
      } else if (selected.r === r && selected.c === c) {
        selected = null;
      } else {
        if (grid[selected.r][selected.c] === grid[r][c] && canConnect(selected.r, selected.c, r, c)) {
          grid[selected.r][selected.c] = null;
          grid[r][c] = null;
          matched++;
          document.getElementById('matched').textContent = 'Matched: ' + matched + ' / ' + TOTAL_PAIRS;
          selected = null;
        } else {
          selected = {r, c};
        }
      }
      render();
      checkWin();
    }

    // Link path check — simplified, Manhattan with 2 turns
    function canConnect(r1, c1, r2, c2) {
      if (lineClear(r1, c1, r2, c2)) return true;
      // Try 1 turn
      if (!get(r1, c2) && lineClear(r1, c1, r1, c2) && lineClear(r1, c2, r2, c2)) return true;
      if (!get(r2, c1) && lineClear(r1, c1, r2, c1) && lineClear(r2, c1, r2, c2)) return true;
      // Try 2 turns
      for (let c = -1; c <= COLS; c++) {
        if (c === c1 || c === c2) continue;
        if (!get(r1, c) && !get(r2, c) && lineClear(r1, c1, r1, c) && lineClear(r1, c, r2, c) && lineClear(r2, c, r2, c2)) return true;
      }
      for (let r = -1; r <= ROWS; r++) {
        if (r === r1 || r === r2) continue;
        if (!get(r, c1) && !get(r, c2) && lineClear(r1, c1, r, c1) && lineClear(r, c1, r, c2) && lineClear(r, c2, r2, c2)) return true;
      }
      return false;
    }

    function lineClear(r1, c1, r2, c2) {
      if (r1 === r2) {
        const [minC, maxC] = [Math.min(c1, c2), Math.max(c1, c2)];
        for (let c = minC + 1; c < maxC; c++) {
          if (get(r1, c)) return false;
        }
        return true;
      }
      if (c1 === c2) {
        const [minR, maxR] = [Math.min(r1, r2), Math.max(r1, r2)];
        for (let r = minR + 1; r < maxR; r++) {
          if (get(r, c1)) return false;
        }
        return true;
      }
      return false;
    }

    function get(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      return grid[r][c] !== null;
    }

    function checkWin() {
      if (matched === TOTAL_PAIRS) {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        setTimeout(() => alert(`🎉 All cleared! Time: ${sec}s`), 300);
      }
    }

    document.getElementById('reset').onclick = initGame;
    // Timer
    setInterval(() => {
      const s = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('time').textContent = s + 's';
    }, 1000);

    initGame();
  </script>
</body>
</html>
